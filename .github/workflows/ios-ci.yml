name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show available simulators
        run: xcrun simctl list devices available | sed -n '1,60p'

      - name: Resolve a simulator destination
        id: dest
        run: |
          # Pick any available iPhone runtime rather than pinning a device name
          # that a future runner image might drop.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                ids=[dev['udid'] for rt,devs in d.items() if 'iOS' in rt \
                     for dev in devs if dev.get('isAvailable') and 'iPhone' in dev['name']]; \
                print(ids[-1] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project WarMapStudio.xcodeproj \
            -scheme WarMapStudio \
            -configuration Debug \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -400

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WarMapStudio.xcodeproj \
            -scheme WarMapStudio \
            -configuration Debug \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -400

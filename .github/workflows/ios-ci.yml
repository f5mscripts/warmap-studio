name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve a simulator destination
        id: dest
        run: |
          # Pick any available iPhone runtime rather than pinning a device name
          # that a future runner image might drop.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                ids=[dev['udid'] for rt,devs in d.items() if 'iOS' in rt \
                     for dev in devs if dev.get('isAvailable') and 'iPhone' in dev['name']]; \
                print(ids[-1] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # xcodebuild echoes every full compiler invocation, which buries the actual
      # diagnostics thousands of lines deep. Send the raw log to a file and print
      # only what a human (or an agent reading these logs) needs.
      - name: Build
        run: |
          set +e
          xcodebuild build \
            -project WarMapStudio.xcodeproj \
            -scheme WarMapStudio \
            -configuration Debug \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "(error|warning):|^\*\* BUILD" build.log | sort -u | head -80
          echo "--- build exited $status ---"
          exit $status

      - name: Test
        run: |
          set +e
          xcodebuild test \
            -project WarMapStudio.xcodeproj \
            -scheme WarMapStudio \
            -configuration Debug \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|failed|Executed [0-9]+ test|^\*\* TEST" test.log | head -80
          echo "--- test exited $status ---"
          exit $status

      - name: Upload raw logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          retention-days: 5

      # Repeat the diagnostics as the very last thing in the job. The artifact
      # upload above prints thirty lines of its own, which otherwise pushes the
      # actual errors out of reach of a tail-based log read.
      - name: Failure summary
        if: failure()
        run: |
          echo "================ FAILURE SUMMARY ================"
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            grep -E "error:|^\*\* (BUILD|TEST) FAILED|Executed [0-9]+ test" "$f" \
              | sort -u | head -40
          done
          echo "================= END OF SUMMARY ================="
